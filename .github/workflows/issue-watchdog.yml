name: 🐕 Issue Watchdog

on:
  issues:
    types: [opened, edited]

jobs:
  validate-submission:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check Content Validity
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";

            const hasValidLink = /https?:\/\/[^\s]+/.test(body);
            const hasEmissionRules = body.includes("Token Emission Schedule:") && body.length > 300; 

            if (!hasValidLink || !hasEmissionRules) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `⚠️ **Invalid Submission Detected** \n\n@${issue.user.login}, your issue has been automatically closed because it does not follow the required template.\n\n**Reasons could be:**\n1. Missing a valid **DFIOracle Contract Link** (must be a full URL starting with \`https://\`).\n2. Missing or incomplete **Token Emission Rules**.\n\nPlease review the requirements in the [README](https://github.com{context.repo.owner}/${context.repo.repo}#readme) and open a new issue with complete information.`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });

              console.log(`Watchdog: Closed Issue #${issue.number} due to invalid template compliance.`);
            } else {
              console.log(`Watchdog: Issue #${issue.number} passed validation.`);
            }
