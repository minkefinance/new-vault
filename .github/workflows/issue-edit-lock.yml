name: Save Approved Snapshot

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  save-snapshot:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'approved'

    steps:
      - name: Save or Update readable snapshot to comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          # 1. check exits
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- ID: approved-content-snapshot -->")) | .id' | head -n 1)

          # 2. gen msg
          SNAPSHOT_MSG="🔒 **Approved Content Archive**
          export SNAPSHOT_MSG=$(cat << 'EOF'
          🔒 **Approved Content Archive**

          This issue has been approved. The content below is archived and locked.

          ---

          ### 📝 Archived Title
          > $TITLE

          ### 📄 Archived Body
          ```markdown
          \$BODY
          ```

          <!-- ID: approved-content-snapshot -->
          <!-- MACHINE_READABLE_START
          TITLE_START:$TITLE:TITLE_END
          BODY_START:$BODY:BODY_END
          MACHINE_READABLE_END -->
          EOF
          )
          
          SNAPSHOT_MSG=$(echo "$SNAPSHOT_MSG" | perl -pe 's/^\s{10}//')
          # 3. exec
          if [ -z "$COMMENT_ID" ]; then
            echo "Bot action: No existing snapshot found. Creating a new archive comment..."
            gh issue comment "$ISSUE_URL" --body "$SNAPSHOT_MSG"
          else
            echo "Bot action: Existing snapshot found (ID: $COMMENT_ID). Updating the archive with the latest approved version..."
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$SNAPSHOT_MSG"
          fi
