name: 📋 New Vault Application
description: Submit a new application for a new-vault
title: "[Vault Application]: <Project Name>"
labels: ["new-vault", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a new vault application. Please fill out all required fields below. Incomplete submissions will be automatically closed.

  - type: input
    id: contract_address
    attributes:
      label: 1. DFIOracle Contract Address
      description: Provide the deployed and verified smart contract address.
      placeholder: "e.g., 0x1234567890abcdef..."
    validations:
      required: true

  - type: input
    id: explorer_link
    attributes:
      label: Block Explorer Link
      description: Link to the verified contract on Etherscan, Basescan, etc.
      placeholder: "https://etherscan.io..."
    validations:
      required: true

  - type: textarea
    id: emission_rules
    attributes:
      label: 2. DFIOracle Description & Token Emission Rules
      description: Detail how tokens are released. Include the release schedule, distribution mechanics, and any halving/decay mechanisms.
      placeholder: |
        - Project Overview: 
        - Token Emission Schedule: (How tokens are minted/released over time)
        - Distribution Mechanics: (Who receives the tokens and in what proportions)
        - Halving/Decay Mechanism: (If applicable, how emission decreases over time)
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      options:
        - label: I confirm the DFIOracle contract address is accurate and publicly verified.
          required: true
        - label: I have fully described the token emission rules above.
          required: true
